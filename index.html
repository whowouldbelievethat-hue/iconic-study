<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toji Studying</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Reem+Kufi:wght@600;700&family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3eaf7;--paper:#f6f8fc;--ink:#0f1a2e;--bd:#0f1a2e;--sh:#0f1a2e;--ac:#d9480f;--ac2:#ffd8bf;--tone:#cfd9ee;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--paper:#121c30;--ink:#e9eef7;--bd:#5f7bb0;--sh:#02050c;--ac:#ff7a3d;--ac2:#2b3f66;--tone:#1b2a47;--on:#140a05;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--paper:#121c30;--ink:#e9eef7;--bd:#5f7bb0;--sh:#02050c;--ac:#ff7a3d;--ac2:#2b3f66;--tone:#1b2a47;--on:#140a05;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;font-weight:500;color:var(--ink);background:var(--bg) radial-gradient(var(--tone) 1.3px,transparent 1.5px) 0 0/9px 9px fixed;min-height:100%}
h1,h2,.sfx{font-family:'Reem Kufi','Bangers',sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:4px solid var(--bd);background:var(--ac);color:var(--on)}
h1{margin:0;font-size:26px;letter-spacing:1px;font-family:'Bangers','Reem Kufi',sans-serif;direction:ltr}h2{margin:0 0 8px;font-size:20px}
#pg{max-width:760px;margin:0 auto;padding:6px 12px 110px}
.pn{background:var(--paper);border:4px solid var(--bd);border-radius:20px;box-shadow:6px 6px 0 var(--sh);padding:14px;margin:16px 0;position:relative}
.hero{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr)}
.hero img{width:100%;max-height:340px;object-fit:cover;object-position:50% 25%;display:block;border-bottom:4px solid var(--bd);filter:contrast(1.05)}

@keyframes shk{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.cap{position:absolute;inset-inline:0;top:0;padding:8px 12px;display:flex;justify-content:space-between;pointer-events:none}
.sfx{display:inline-block;font-size:30px;color:var(--ac);-webkit-text-stroke:2px var(--sh);paint-order:stroke fill;transform:rotate(-4deg);letter-spacing:1px;direction:ltr}
.hb{padding:12px}
.bt{border-radius:14px;font:inherit;font-weight:800;background:var(--ac);color:var(--on);border:3px solid var(--bd);padding:6px 16px;box-shadow:4px 4px 0 var(--sh);cursor:pointer;min-height:44px}
.bt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}.bt.g{background:var(--paper);color:var(--ink)}.bt.sm{min-height:36px;padding:2px 10px}.bt.big{font-size:20px;padding:6px 30px}
:focus-visible{outline:4px solid #3ea8ff;outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--bd);padding:6px 8px;min-width:0;max-width:100%}
input[type=number]{width:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row.c{justify-content:center}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.tabs button{font:inherit;font-weight:800;color:var(--ink);background:none;border:3px solid var(--bd);padding:4px 12px;cursor:pointer}.tabs [aria-selected=true]{background:var(--ac);color:var(--on)}
.ringw{position:relative;width:min(270px,74vw);margin:4px auto}.ringw svg{width:100%;display:block}
.o{fill:none;stroke:var(--bd);stroke-width:28}.tr{fill:none;stroke:var(--paper);stroke-width:18}.p{fill:none;stroke:var(--ac);stroke-width:18;transform:rotate(-90deg);transform-origin:100px 100px;stroke-dasharray:553;transition:stroke-dashoffset .3s}
.tx{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bangers',sans-serif;font-size:clamp(42px,14vw,64px);direction:ltr;letter-spacing:2px}
.bar{height:20px;border:3px solid var(--bd);background:var(--paper)}.bar i{display:block;height:100%;background:var(--ac)}
.it{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:3px dashed var(--bd);padding:8px 0}.it:last-child{border:0}.it>b{flex:1;min-width:120px}.dn{text-decoration:line-through;opacity:.55}
.chip{border:3px solid var(--bd);padding:0 8px;font-size:13px;background:var(--ac2);color:var(--ink)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g3 .pn{text-align:center;margin:10px 0;padding:8px}.g3 b{display:block;font-size:28px;font-family:'Bangers',sans-serif}
#nv{position:fixed;inset:auto 0 0 0;display:flex;background:var(--paper);border-top:4px solid var(--bd);padding:0 2px calc(2px + env(safe-area-inset-bottom,0px));z-index:5}
#nv button{flex:1;font:inherit;font-size:12px;font-weight:800;background:none;border:0;color:var(--ink);padding:4px 0;cursor:pointer;min-height:52px}#nv button span{display:block;font-size:20px}
#nv [aria-current=true]{background:var(--ac);color:var(--on)}
#ts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:12;background:var(--ac);color:var(--on);border:3px solid var(--bd);padding:8px 16px;box-shadow:4px 4px 0 var(--sh);font-weight:800;opacity:0;pointer-events:none;transition:opacity .3s}#ts.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pic{position:relative;border-bottom:4px solid var(--bd)}.pic img{border:0!important;max-height:300px!important;filter:saturate(.85) brightness(1.08) contrast(.95)!important}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffb3c166,#a8d8ff44);mix-blend-mode:screen;pointer-events:none}
.pic i{position:absolute;z-index:2;font-style:normal;font-size:22px;animation:fl 3s ease-in-out infinite}.pic i:nth-of-type(1){top:10px;inset-inline-end:14px}.pic i:nth-of-type(2){top:46%;inset-inline-start:10px;animation-delay:.8s}.pic i:nth-of-type(3){bottom:46px;inset-inline-end:22px;animation-delay:1.6s}
@keyframes fl{50%{transform:translateY(-8px) rotate(10deg)}}
.bub{position:absolute;z-index:2;inset-inline-start:10px;bottom:10px;max-width:78%;background:#fff;color:#140607;border:3px solid #140607;border-radius:16px 16px 16px 4px;padding:4px 12px;font-weight:800;font-size:14px}
.fm header,.fm #nv,.fm .nf,.fm footer{display:none!important}#fx{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-start:10px;z-index:9}.fm #fx{display:block}
.fm #pg{padding-top:30px}.chat{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:6px}.chat div{padding:6px 10px;border:3px solid var(--bd);border-radius:14px;white-space:pre-wrap}.chat .u{background:var(--ac2);align-self:flex-start}.chat .a{background:var(--paper);align-self:flex-end}
footer{text-align:center;padding:4px 0 90px;font-family:'Bangers',sans-serif;font-size:18px;letter-spacing:1px;direction:ltr}
:root[data-rm] *,:root[data-rm] *::before,:root[data-rm] *::after{animation:none!important;transition:none!important}
.sub{padding-inline-start:24px;width:100%}.sub label{display:block}.drag{cursor:grab}
#nv button{font-size:10.5px}.day{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:3px dashed var(--bd);padding:6px 0}.day>b{width:64px}

.pic{height:300px;overflow:hidden}.pic img{position:absolute;inset:0;width:100%;height:100%;max-height:none!important;object-fit:cover;opacity:0;transition:opacity .9s;animation:br 14s ease-in-out infinite alternate;filter:none!important;border:0!important}.pic img.a{opacity:1}
.pic::after{background:linear-gradient(180deg,transparent 55%,#0b1220aa),linear-gradient(135deg,#ff7a3d22,#3ea8ff18)!important;mix-blend-mode:normal!important}
@keyframes br{to{transform:scale(1.07)}}
.pt{position:absolute;z-index:2;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#ffb27a;opacity:0;animation:rise 7s linear infinite;pointer-events:none}
@keyframes rise{20%{opacity:.9}to{bottom:100%;opacity:0}}
.hero.on .pic::before{content:"";position:absolute;inset:0;z-index:2;box-shadow:inset 0 0 60px #ff7a3d88;animation:gl 2s ease-in-out infinite alternate;pointer-events:none}
@keyframes gl{to{box-shadow:inset 0 0 90px #ff7a3dcc}}
#nv button span{display:flex;justify-content:center;margin-bottom:2px}

input,select{background:var(--paper)}
#mb{position:fixed;z-index:8;inset-inline-end:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center}
#sp{position:fixed;z-index:8;inset-inline:8px;bottom:calc(124px + env(safe-area-inset-bottom,0px));max-width:520px;margin-inline:auto;background:var(--paper);border:4px solid var(--bd);border-radius:20px;box-shadow:6px 6px 0 var(--sh);padding:10px;visibility:hidden;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s}
#sp.open{visibility:visible;opacity:1;transform:none;pointer-events:auto}#sp iframe{display:block;margin-top:6px}#sp a{display:inline-block;margin-top:6px;color:var(--ink);font-weight:800}
.fm #mb{bottom:14px}.fm #sp{bottom:72px}
#sp input[type=range]{width:110px;padding:0}
</style></head><body>

<div class="row nf"><select data-f="st" aria-label="الحالة"><option value="">كل الحالات</option>${sel('',F.st,ST)}</select><select data-f="pr" aria-label="الأولوية"><option value="">كل الأولويات</option>${sel('',F.pr,{l:'منخفضة',m:'متوسطة',h:'عالية'})}</select><select data-f="sj" aria-label="المادة"><option value="">كل المواد</option>${S.sj.map(x=>`<option value="${x.id}" ${F.sj===x.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select></div>`+(L.length?`<section class="pn" id="tl">${L.map(x=>`<div class="it drag" draggable="true" data-dr="${x.id}"><button class="bt sm ${x.st==='d'?'g':''}" data-a="tkst" data-id="${x.id}">${ST[x.st]}</button><b class="${x.st==='d'?'dn':''}">${esc(x.t)}<br><small>${esc(x.d||'')}</small></b><span class="chip">${PR[x.pr]}</span><span class="chip">${esc(sjn(x.sj))}</span><span class="chip">${x.due||'بدون موعد'}</span><button class="bt sm" data-a="act" data-id="${x.id}">${S.act===x.id?'الحالية ✓':'ذاكرها'}</button>${dl('tk:'+x.id)}<div class="sub">${x.sub.map((s,i)=>`<label><input type="checkbox" data-a="sbt" data-v="${x.id}:${i}" ${s.d?'checked':''}> ${esc(s.t)}</label>`).join('')}<div class="row"><input id="sb${x.id}" placeholder="مهمة فرعية" maxlength="60"><button class="bt sm g" data-a="sbadd" data-id="${x.id}">＋</button></div></div></div>`).join('')}</section>`:empty('مفيش مهام هنا','اكتب مهمتك الأولى فوق وابدأ. تقدر ترتبها بالسحب.'))},
plan:()=>`<section class="pn"><h2>خطة الأسبوع</h2><p>الهدف اليومي ${S.cfg.goal} دقيقة = ${Math.max(1,Math.floor(S.cfg.goal/S.cfg.f))} جلسات، موزعة على مواد أعلى أولوية وأقل إنجازاً.</p><button class="bt" data-a="plan">${S.pl?'أعد التوزيع':'ولّد الخطة تلقائياً'}</button> ${S.pl?'<button class="bt g" data-a="expplan">حمّل الخطة كصورة</button>':''}</section>`+(S.pl?`<section class="pn">${S.pl.map((d,i)=>`<div class="day"><b>${DAYS[i]}</b>${d.map((s,j)=>`<button class="chip" data-a="pdel" data-v="${i}:${j}" title="اضغط للحذف">${esc(sjn(s))} ✕</button>`).join('')}<select id="pa${i}" aria-label="مادة"><option value="">＋</option>${S.sj.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select><button class="bt sm g" data-a="padd" data-id="${i}">أضف</button></div>`).join('')}</section>`:empty('مفيش خطة لسه','ضيف مواد وبعدين ولّد الخطة.'))+cal(),
stats:()=>{const L=lvl(),b0=100*(L-1)**2,b1=100*L*L,w0=wk(0),w1=wk(1),mx=Math.max(60,...w0,...w1),tot=sum(S.lg.map(l=>l.m)),by=Array(7).fill(0);S.lg.forEach(l=>by[new Date(l.t).getDay()]+=l.m);const tp={};S.lg.forEach(l=>tp[l.s]=(tp[l.s]||0)+l.m);const tk=Object.keys(tp).sort((a,b)=>tp[b]-tp[a])[0];
return`<section class="pn hero"><div class="pic"><img class="a" src="${I2}" alt="" style="object-position:50% 45%">${PT}</div><div class="hb"><span class="sfx">LV ${L}</span>${bar((S.xp-b0)/(b1-b0)*100)}<p>${S.xp} XP · الباقي ${b1-S.xp} للمستوى الجاي</p></div></section>
<div class="g3"><div class="pn"><b>${sd(dk(0))}</b>اليوم (د)</div><div class="pn"><b>${sum(w0)}</b>الأسبوع (د)</div><div class="pn"><b>${S.lg.filter(l=>l.d.slice(0,7)===dk(0).slice(0,7)).reduce((a,l)=>a+l.m,0)}</b>الشهر (د)</div><div class="pn"><b>${S.lg.length}</b>جلسات</div><div class="pn"><b>${S.lg.length?Math.round(tot/S.lg.length):0}</b>متوسط الجلسة</div><div class="pn"><b>${S.lg.length?Math.max(...S.lg.map(l=>l.m)):0}</b>أطول جلسة</div></div>
<section class="pn"><h2>الأسبوع ده مقابل اللي فات</h2><svg viewBox="0 0 280 100" role="img" aria-label="مقارنة أسبوعين" style="width:100%">${w0.map((v,i)=>`<rect x="${i*40+4}" y="${95-w1[i]/mx*85}" width="15" height="${w1[i]/mx*85}" fill="var(--ac2)" stroke="var(--ink)" stroke-width="2"/><rect x="${i*40+19}" y="${95-v/mx*85}" width="15" height="${v/mx*85}" fill="var(--ac)" stroke="var(--ink)" stroke-width="2"/>`).join('')}<line x1="0" x2="280" y1="95" y2="95" stroke="var(--ink)" stroke-width="3"/></svg><p>السلسلة ${streak()} يوم · أفضل يوم ${S.lg.length?DAYS[by.indexOf(Math.max(...by))]:'-'} · أكتر مادة ${S.lg.length?esc(sjn(tk)):'-'}</p></section>
<section class="pn"><h2>تحدي اليوم</h2><p>ذاكر 3 جلسات (${Math.min(ses(),3)}/3) ${ses()>=3?'✓':''}</p>${bar(Math.min(ses(),3)/3*100)}<h2 style="margin-top:12px">تحدي الأسبوع</h2><p>ذاكر 600 دقيقة الأسبوع ده (${Math.min(sum(w0),600)}/600)</p>${bar(sum(w0)/6)}<h2 style="margin-top:12px">الشارات</h2>${BG.map(([n,f])=>`<span class="chip" style="display:inline-block;margin:3px;padding:2px 10px;${f()?'':'opacity:.4'}">${f()?'★':'☆'} ${n}</span>`).join('')}</section>`},
settings:()=>`<section class="pn"><h2>الإعدادات</h2><p>الحساب: <b dir="ltr">${U}</b></p><div class="row">الاسم <input data-c="name" value="${esc(S.cfg.name)}" maxlength="20"></div>
<div class="row">تركيز <input type="number" data-c="f" min="1" max="120" value="${S.cfg.f}"> راحة <input type="number" data-c="s" min="1" max="60" value="${S.cfg.s}"> طويلة <input type="number" data-c="l" min="1" max="90" value="${S.cfg.l}"> جولات <input type="number" data-c="n" min="1" max="10" value="${S.cfg.n}"></div>
<div class="row">هدف المذاكرة اليومي (د) <input type="number" data-c="goal" min="10" max="900" value="${S.cfg.goal}"></div>
<label class="row"><input type="checkbox" data-t="snd" ${S.cfg.snd?'checked':''}> تنبيه صوتي</label><label class="row"><input type="checkbox" data-t="rm" ${S.cfg.rm?'checked':''}> تقليل الحركة</label><label class="row"><input type="checkbox" data-t="auto" ${S.cfg.auto?'checked':''}> وضع ليلي تلقائي (من 7 مساءً لـ 6 صباحاً)</label>
<div class="row"><button class="bt g" data-a="notif">${S.cfg.notif?'الإشعارات شغالة ✓':'تفعيل الإشعارات'}</button><button class="bt g" data-a="exp">تصدير بياناتي</button><button class="bt g" data-a="logout">تسجيل خروج</button>${dl('all:x','حذف الحساب')}</div></section>`
};
const IC={home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',subjects:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19a2 2 0 0 1 2-2h13"/>',tasks:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',stats:'<path d="M5 20V11M12 20V4M19 20v-6M2 20h20"/>',settings:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const NAV=[['home','','الرئيسية'],['timer','','المؤقت'],['subjects','','المواد'],['tasks','','المهام'],['plan','','الخطة'],['stats','','الإنجاز'],['settings','','الإعدادات']];
function view(){if(U&&S.cfg.auto){const h=new Date().getHours();document.documentElement.dataset.theme=h>=19||h<6?'dark':'light'}const a=document.activeElement&&document.activeElement.id;document.documentElement.toggleAttribute('data-rm',!!S.cfg.rm);$('#pg').innerHTML=(U?H[P]:H.login)();$('#mb').style.display=U?'':'none';$('#nv').innerHTML=!U?'':NAV.map(([k,i,n])=>`<button data-go="${k}" ${k===P?'aria-current="true"':''}><span>${ic(k)}</span>${n}</button>`).join('');const c=$('#cl');if(c)c.scrollTop=1e9;tick()}
function tick(){if(P!=='timer')return;const c=cur(),d=dur(),t=$('#tx');if(!t)return;if(S.run&&S.mode!=='stop'&&c<=0){fin();return}
const sec=Math.ceil(c),h=Math.floor(sec/3600),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');t.textContent=(h?h+':':'')+m+':'+s;$('#pr').style.strokeDashoffset=553*(1-(S.mode==='stop'?(c%3600)/3600:d?c/d:0));
$('#go').textContent=S.run?'إيقاف':'ابدأ';const f=S.run&&(S.mode!=='pomo'||S.ph==='f');$('#i1').classList.toggle('a',!f);$('#i2').classList.toggle('a',!!f);$('#hr').classList.toggle('on',!!f&&!S.cfg.rm);
$('#bb').textContent=S.mode==='pomo'?(S.ph==='f'?(S.run?'ذاكر معايا!':'يلا نبدأ!'):TIPS[S.cy%TIPS.length]):S.mode==='stop'?'Toji Studying':'عدّ تنازلي';document.title=(S.run?t.textContent+' · ':'')+'Toji Studying'}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){P=g.dataset.go;if(g.dataset.start){S.mode='pomo';S.ph='f';S.run=0;S.rem=dur()}save();view();return}const a=e.target.closest('[data-a]');if(!a||a.type==='checkbox'&&e.type!=='click')return;A[a.dataset.a](a.dataset.v||a.dataset.id);save();if(a.dataset.a!=='login')view()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.cd!==undefined){S.cd[+d.cd]=Math.max(0,+t.value||0);if(!S.run)S.rem=dur()}else if(d.c){S.cfg[d.c]=d.c==='name'?t.value.slice(0,20):Math.max(1,+t.value||1);if(!S.run&&S.mode==='pomo')S.rem=dur()}else if(d.sel!==undefined)S.sel=t.value;else if(d.act!==undefined)S.act=t.value;else if(d.f)F[d.f]=t.value;else if(d.t){S.cfg[d.t]=t.checked?1:0}else return;save();view()});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){S.cfg['v'+k]=+e.target.value;amb(k,+e.target.value);save()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&U&&P==='timer'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)){e.preventDefault();A.go();save();view();return}if(e.key==='Enter'&&e.target.dataset.enter){A[e.target.dataset.enter]();}});
let dg;document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('[data-dr]');dg=r&&r.dataset.dr});document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-dr]'))e.preventDefault()});
document.addEventListener('drop',e=>{const r=e.target.closest('[data-dr]');if(!r||!dg||r.dataset.dr===dg)return;e.preventDefault();const a=S.tk.findIndex(x=>x.id===dg),[m]=S.tk.splice(a,1),b=S.tk.findIndex(x=>x.id===r.dataset.dr);S.tk.splice(b,0,m);save();view()});
$('#mo').onclick=()=>{if(U){S.cfg.auto=0;save()}const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('toji-th',r.dataset.theme)}catch(e){}};
if(S.run&&S.mode!=='stop'&&S.end<Date.now()){S.run=0;S.rem=dur()}

due();setInterval(due,600000);setInterval(tick,250);boot();
